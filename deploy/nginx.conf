# TBBT 台词搜索 —— nginx 站点配置
#
# 部署：
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/tbbt
#   sudo ln -s /etc/nginx/sites-available/tbbt /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d tbbt.example.com     # 自动补上 443 与跳转
#
# 设计要点（AGENTS.md 第 10 节）：
# - 前端与 API **同源**（同一域名同一端口）→ 不需要任何 CORS 配置，
#   与本地开发时 Vite proxy 的同源形态一致。
# - **绝不代理 /v/**：视频由浏览器直连 Cloudflare R2（后端返回的 video 字段
#   指向 R2 域名）。在这里代理会让香港轻量的 30 Mbps 峰值带宽成为瓶颈，
#   也白白浪费 R2 出网免费的优势。所以下面显式 404 掉 /v/。

server {
    listen 80;
    listen [::]:80;
    server_name tbbt.example.com;              # ← 改成你的域名

    root /var/www/tbbt;                        # `npm run build` 的 dist/ 内容
    index index.html;

    # ---- API：反代到本机 uvicorn ----
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ---- 明确拒绝 /v/：视频在 R2，不该打到这台机器 ----
    # 这条同时起到「防止后人误配」和「省带宽」的作用。
    location /v/ {
        return 404;
    }

    # ---- 版权缓解（AGENTS.md 第 7 节）：禁止爬虫索引 ----
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # ---- 前端静态资源 ----
    # 带内容哈希的构建产物可以长缓存
    location ~* \.(js|css|woff2?|svg|png|jpe?g|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA 回落；index.html 必须不缓存，否则发版后用户拿到旧的
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
